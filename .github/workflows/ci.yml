name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: lexradar legal-source prepare --metadata examples/legal-sources/metadata-v1.json --text examples/legal-sources/originals/v1.txt --event-date 2025-06-01 --output /tmp/lexradar-source-prepared
      - run: lexradar legal-source check --registry examples/legal-sources/registry.json --event-date 2025-06-01 --output /tmp/lexradar-source-past
      - run: lexradar legal-source check --registry examples/legal-sources/registry.json --event-date 2026-06-01 --output /tmp/lexradar-source-current
      - run: python -c "import json; p=json.load(open('/tmp/lexradar-source-past/report.json')); c=json.load(open('/tmp/lexradar-source-current/report.json')); assert all(a['status']=='unverified' and not a['card_assessment']['trusted'] for a in c['assessments']); assert [a['card_assessment']['temporal_claim'] for a in p['assessments'][:2]]==['within_declared_interval','not_yet_effective']; assert [a['card_assessment']['temporal_claim'] for a in c['assessments'][:2]]==['expired','within_declared_interval']; assert not c['production_go_allowed'] and not c['client_release_allowed']"
      - run: lexradar demo examples/input.json --output /tmp/report.json
      - run: diff examples/result.json /tmp/report.json
      - run: lexradar inspect-evidence examples/reading-dossier --evidence document-0003 --page 1 --output /tmp/lexradar-reading-template
      - run: lexradar record-visual-review examples/reading-dossier --submission /tmp/lexradar-reading-template/observations.json --output /tmp/lexradar-reading-pending
      - run: python -c "from pathlib import Path; from lexradar.collector.visual_review import verify_sidecar; r=verify_sidecar(Path('examples/reading-dossier'),Path('/tmp/lexradar-reading-pending')); assert r['trust_status']=='untrusted' and not r['production_go_allowed']"
      - run: lexradar review-decision examples/analysis-dossier --finding examples/decision-finding.json --registry examples/legal-registry.json --output /tmp/lexradar-decision-review
      - run: lexradar decide examples/analysis-dossier --finding examples/decision-finding.json --registry examples/legal-registry.json --output /tmp/lexradar-production-decision.json
      - run: python -c "import json; d=json.load(open('/tmp/lexradar-production-decision.json')); assert d['decision_scope']=='production' and d['outcome']=='HOLD' and not d['legal_research_completed'] and not d['client_release_allowed']"
      - run: lexradar analyze examples/analysis-dossier --output /tmp/lexradar-analysis
      - run: lexradar preflight examples/analysis-dossier --output /tmp/lexradar-preflight
      - run: lexradar verify examples/analysis-dossier --registry examples/legal-registry.json --output /tmp/lexradar-verifier-one
      - run: lexradar verify-compare examples/analysis-dossier --registry examples/legal-registry.json --stage-one /tmp/lexradar-verifier-one --analysis /tmp/lexradar-analysis/analysis.json --output /tmp/lexradar-verifier-final
      - run: lexradar verify-preflight examples/analysis-dossier --registry examples/legal-registry.json --output /tmp/lexradar-verifier-preflight
      - run: lexradar benchmark --suite tests/benchmarks --output /tmp/lexradar-benchmark
      - run: lexradar quality-report /tmp/lexradar-benchmark --format html
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-quality-report
          path: /tmp/lexradar-benchmark
          retention-days: 7
