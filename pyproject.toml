[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lexradar"
version = "0.3.0"
description = "Evidence-first legal audit foundation"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "playwright>=1.51,<2", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
lexradar = "lexradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.package-data]
"lexradar.auditors" = ["prompts/*.txt"]
